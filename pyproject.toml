[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "it-support-quiz-bot"
version = "0.1.0"
description = "A Discord bot for IT knowledge quizzes with AI assistance"
authors = [{name = "Maintainers"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false